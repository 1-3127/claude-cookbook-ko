[tox]
envlist = structure, execution
isolated_build = true
# 빠른 환경 생성을 위해 tox-uv 사용
requires = tox-uv

[testenv]
# 모든 테스트 환경의 공통 설정
runner = uv-venv-lock-runner
deps =
    pytest>=8.3.3
    pyyaml>=6.0.3
    nbconvert>=7.16.0
    nbval>=0.11.0
passenv =
    ANTHROPIC_API_KEY
    HOME
    USER

[testenv:structure]
# 빠른 구조 테스트 - Notebook 실행 없음, API 호출 없음
description = Run structural validation tests on notebooks (fast, no API calls)
commands =
    pytest tests/notebook_tests/test_notebooks.py \
        -v \
        --tb=short \
        -m "not slow" \
        {posargs}

[testenv:structure-single]
# 단일 Notebook 구조 테스트
description = Run structural tests on a single notebook
commands =
    pytest tests/notebook_tests/test_notebooks.py \
        -v \
        --tb=short \
        -m "not slow" \
        --notebook {posargs}

[testenv:execution]
# 전체 실행 테스트 - API key 필요, 느림
description = Execute notebooks in isolated environment (slow, requires API key)
passenv =
    ANTHROPIC_API_KEY
    HOME
    USER
    OPENAI_API_KEY
    VOYAGE_API_KEY
    PINECONE_API_KEY
    MONGODB_URI
deps =
    pytest>=8.3.3
    pyyaml>=6.0.3
    nbconvert>=7.16.0
    nbval>=0.11.0
    anthropic>=0.71.0
    ipykernel>=7.1.0
    notebook>=7.4.7
commands =
    pytest tests/notebook_tests/test_notebooks.py \
        -v \
        --tb=short \
        --execute-notebooks \
        --notebook-timeout 300 \
        {posargs}

[testenv:execution-single]
# 단일 Notebook 실행
description = Execute a single notebook in isolated environment
passenv =
    ANTHROPIC_API_KEY
    HOME
    USER
    OPENAI_API_KEY
    VOYAGE_API_KEY
    PINECONE_API_KEY
    MONGODB_URI
deps =
    pytest>=8.3.3
    pyyaml>=6.0.3
    nbconvert>=7.16.0
    nbval>=0.11.0
    anthropic>=0.71.0
    ipykernel>=7.1.0
    notebook>=7.4.7
commands =
    pytest tests/notebook_tests/test_notebooks.py \
        -v \
        --tb=long \
        --execute-notebooks \
        --notebook-timeout 300 \
        --notebook {posargs}

[testenv:registry]
# registry.yaml에 나열된 Notebook만 테스트
description = Test notebooks listed in registry.yaml
commands =
    pytest tests/notebook_tests/test_notebooks.py \
        -v \
        --tb=short \
        -m "not slow" \
        --registry-only \
        {posargs}

[testenv:quick]
# Notebook 일부에 빠른 smoke test
description = Quick smoke test on core capability notebooks
commands =
    pytest tests/notebook_tests/test_notebooks.py \
        -v \
        --tb=short \
        -m "not slow" \
        --notebook-dir capabilities \
        {posargs}

[testenv:third-party]
# 서드파티 통합 Notebook 테스트
description = Test third-party integration notebooks
passenv =
    ANTHROPIC_API_KEY
    HOME
    USER
    OPENAI_API_KEY
    VOYAGE_API_KEY
    PINECONE_API_KEY
    MONGODB_URI
    DEEPGRAM_API_KEY
    ELEVENLABS_API_KEY
    WOLFRAM_APP_ID
commands =
    pytest tests/notebook_tests/test_notebooks.py \
        -v \
        --tb=short \
        -m "not slow" \
        --notebook-dir third_party \
        {posargs}

[testenv:lint]
# Lint 검사 실행
description = Run ruff linting and format checks
deps =
    ruff>=0.14.2
commands =
    ruff check .
    ruff format --check .

[testenv:format]
# 코드 포맷팅
description = Format code with ruff
deps =
    ruff>=0.14.2
commands =
    ruff format .
    ruff check --fix .
