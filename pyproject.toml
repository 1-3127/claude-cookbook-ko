[project]
name = "anthropic-cookbook"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.109.0",
    "claude-agent-sdk>=0.1.50",
    "ipykernel>=7.1.0",
    "notebook>=7.4.7",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "jupyter>=1.1.1",
    "rich>=14.2.0",
    "python-dotenv>=1.2.1",
    "voyageai>=0.3.5",
    "networkx>=3.6.1",
    "matplotlib>=3.10.8",
    "requests>=2.32.5",
    "pymongo>=4.17.0",
    "pyjwt>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14.2",
    "pytest>=8.3.3",
    "nbval>=0.11.0",
    "pre-commit>=3.8.0",
    "nbconvert>=7.16.0",
    "pyyaml>=6.0.3",
    "tox>=4.32.0",
    "tox-uv>=1.29.0",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["anthropic_cookbook"]  # Build system용 dummy package

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]  # Ruff v0.6.0+는 기본적으로 Notebook을 포함하지만 명시하는 것이 더 나음

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B"]
ignore = [
    "E501",   # 줄이 너무 김
    "S101",   # Assert 사용(테스트에서는 허용)
    "S301",   # Cookbook의 로컬 데이터에 pickle 사용 허용
    "S311",   # 암호화 외 용도로 pseudo-random generator 허용
    "S608",   # 시연/교육용 코드에서 SQL 문자열 구성 허용
    "N806",   # 함수 내 변수는 소문자여야 함(API 응답에는 허용)
]

[tool.ruff.lint.per-file-ignores]
# Notebook은 일반 Python 파일과 다른 관례를 따름
"*.ipynb" = [
    "E402",   # 파일 중간 import
    "F811",   # 재정의(Notebook에서 흔함)
    "N803",   # Argument 이름은 소문자여야 함
    "N806",   # 함수 내 변수는 소문자여야 함
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (requires notebook execution)",
    "integration: requires live external services (Atlas / Voyage); skipped without credentials",
    "mutates_state: mutates a real datastore; must run in a disposable namespace and own teardown",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

