name = "cma-self-hosted-sandbox"
main = "src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "SANDBOX_CONTAINER"
class_name = "SandboxContainer"

[[containers]]
class_name = "SandboxContainer"
image = "./container/Dockerfile"
max_instances = 50
# Runner를 debug하도록 `wrangler containers ssh <instance-id>` 활성화.
ssh = { enabled = true }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SandboxRunner", "SandboxContainer"]

[[migrations]]
tag = "v2"
deleted_classes = ["SandboxRunner"]

[vars]
ANTHROPIC_BASE_URL = "https://api.anthropic.com"
# Self-hosted environment id로 교체(Console → Environments).
ANTHROPIC_ENVIRONMENT_ID = "env_01..."

# Secret(`wrangler secret put`으로 설정):
#   ANTHROPIC_WEBHOOK_SECRET
#   ANTHROPIC_ENVIRONMENT_KEY
