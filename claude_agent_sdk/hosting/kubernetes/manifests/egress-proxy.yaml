# Egress Proxy: TLS를 종료하는 nginx reverse proxy. Agent pod는 internet으로
# 직접 보내는 대신 여기에 Anthropic API 요청을 보냅니다. NetworkPolicy와
# 함께 agent pod가 api.anthropic.com에만 접근하며 다른 외부 endpoint에는
# 접근하지 못하게 보장합니다. Proxy는 agent의 TLS를 종료한 뒤 요청을
# 다시 암호화하여 api.anthropic.com으로 보냅니다.
#
# Nginx 구성은 egress-proxy/nginx.conf에 있으며 build 시 egress-proxy image에
# 포함됩니다(egress-proxy/Dockerfile 참고). 그 파일이 단일 기준 출처입니다.
# 여기서는 TLS certificate/key만 mount합니다.
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: egress-proxy
    namespace: claude-agent
spec:
    replicas: 1
    selector:
        matchLabels:
            app: egress-proxy
    template:
        metadata:
            labels:
                app: egress-proxy
        spec:
            containers:
                - name: egress-proxy
                  image: REGISTRY_URL/egress-proxy:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 443
                      - containerPort: 80
                  volumeMounts:
                      - name: tls-certs
                        mountPath: /etc/nginx/certs
                        readOnly: true
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 80
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 80
                      initialDelaySeconds: 5
                      periodSeconds: 10
            volumes:
                - name: tls-certs
                  secret:
                      secretName: egress-proxy-tls
---
apiVersion: v1
kind: Service
metadata:
    name: egress-proxy
    namespace: claude-agent
spec:
    type: ClusterIP
    selector:
        app: egress-proxy
    ports:
        - port: 443
          targetPort: 443
