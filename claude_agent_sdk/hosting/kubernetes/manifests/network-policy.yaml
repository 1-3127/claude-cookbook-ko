# NetworkPolicy: Pod로 들어오고 나가는 network traffic을 제한하는
# Kubernetes firewall 규칙.
#
# 이 policy는 "role: agent" label의 모든 pod를 대상으로 다음을 적용합니다:
#
#     INGRESS(들어오는 traffic):
#         - "app: gateway" label의 pod만 agent pod에 연결할 수 있습니다.
#             나머지 모든 incoming connection은 drop됩니다. 즉 gateway만
#             agent pod에 지시할 수 있으며 cluster의 다른 service는
#             직접 접근할 수 없습니다.
#
#     EGRESS(나가는 traffic):
#         - Agent pod는 port 443(TCP)에서 egress-proxy에 연결할 수 있습니다.
#             Anthropic API로 가는 유일한 경로입니다.
#         - Agent pod는 port 53(UDP 및 TCP)으로 임의의 대상에 DNS query를
#             보낼 수 있습니다. Pod가 egress-proxy service IP를 찾기 전에 DNS
#             resolution이 작동해야 하므로 필요합니다. GKE는 kube-dns pod에
#             직접 연결하지 않고 NodeLocal DNSCache(169.254.20.10)를 사용하므로
#             DNS 규칙을 특정 podSelector로 제한하면서 이식성을 유지할 수 없습니다.
#         - 나머지 모든 outbound traffic은 drop됩니다. Agent pod는 internet,
#             다른 service 또는 다른 namespace에 접근할 수 없습니다.
#
# 전체 효과: Agent pod는 완전히 격리됩니다. Gateway에서만 작업을 받고
# Anthropic API(egress-proxy 경유) 및 DNS와만 통신합니다.
# Data 유출이나 허용되지 않은 endpoint 접근 시도는 모두
# network 수준에서 차단됩니다.
#
# 알려진 잔여 경로: Port 53이 모든 대상에 열려 있으므로 pod 내부의
# 의지가 강한 공격자는 DNS query로 data를 외부로 tunneling할 수
# 있습니다. Cluster가 kube-dns/CoreDNS pod와 직접 통신한다면
# (node-local DNS cache 없음) 마지막 규칙에 다음을 추가하여 강화하세요:
#
#     - to:
#           - namespaceSelector:
#                 matchLabels:
#                     kubernetes.io/metadata.name: kube-system
#       ports: [...]
#
# 또는 resolver에서 DNS policy를 적용하세요(CoreDNS ACL, Cilium DNS policy).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: agent-egress-policy
    namespace: claude-agent
spec:
    podSelector:
        matchLabels:
            role: agent
    policyTypes:
        - Ingress
        - Egress
    ingress:
        - from:
              - podSelector:
                    matchLabels:
                        app: gateway
    egress:
        - to:
              - podSelector:
                    matchLabels:
                        app: egress-proxy
          ports:
              - protocol: TCP
                port: 443
    # DNS: Port 53에서 모든 대상 허용(GKE는 kube-dns pod에 직접 연결하는
    # 대신 169.254.20.10의 NodeLocal DNSCache 사용)
        - ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
