# Gateway: Agent pod lifecycle을 관리하는 중앙 API server.
#
# RBAC(Role-Based Access Control) 설명:
#     Gateway는 agent pod를 on-demand로 생성하고 삭제하기 위해 Kubernetes API
#     permission이 필요합니다. 세 resource로 구성합니다:
#
#     1. ServiceAccount(gateway-sa) — Gateway pod가 실행되는 identity.
#     2. Role(gateway-pod-manager) — 허용할 action 정의: pod에 create,
#           get, list, patch, delete. 정확히 k8s.py의 호출만 허용하며
#           그 이상은 없습니다. Role은 'claude-agent' namespace로만 제한됩니다.
#     3. RoleBinding — Role을 gateway-sa에 연결하여 serviceAccountName:
#           gateway-sa를 사용하는 gateway deployment가 permission을 상속하게 함.
#
#     별도 ServiceAccount(agent-sa)를 agent pod에 제공합니다. 추가 Role이
#     없으며 agent pod에는 Kubernetes API 접근이 필요하지 않습니다. Workload
#     Identity annotation은 필요할 때 cloud provider API에
#     인증하도록 허용합니다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: gateway-sa
    namespace: claude-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: agent-sa
    namespace: claude-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: gateway-pod-manager
    namespace: claude-agent
rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["create", "get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: gateway-pod-manager-binding
    namespace: claude-agent
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: gateway-pod-manager
subjects:
    - kind: ServiceAccount
      name: gateway-sa
      namespace: claude-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: gateway
    namespace: claude-agent
spec:
    replicas: 1
    selector:
        matchLabels:
            app: gateway
    template:
        metadata:
            labels:
                app: gateway
        spec:
            serviceAccountName: gateway-sa
            # Uvicorn은 SIGTERM에서 빠르게 종료하지 않으며 drain에는 5초면 충분합니다.
            terminationGracePeriodSeconds: 5
            containers:
                - name: gateway
                  image: REGISTRY_URL/gateway:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 8080
                  env:
                      - name: REDIS_URL
                        value: "redis://redis:6379"
                      - name: AGENT_IMAGE
                        valueFrom:
                            configMapKeyRef:
                                name: agent-config
                                key: AGENT_IMAGE
                      - name: AGENT_NAMESPACE
                        value: "claude-agent"
                      - name: STANDBY_POOL_SIZE
                        valueFrom:
                            configMapKeyRef:
                                name: agent-config
                                key: STANDBY_POOL_SIZE
                      - name: IDLE_TIMEOUT_S
                        value: "900"
                      # Token→tenant map("tokenA:alice,tokenB:bob"). Session은
                      # 생성한 tenant 범위로 제한됩니다. Secret 생성 전에도 manifest를
                      # 적용할 수 있도록 선택적이지만, 다른 호출자가 접근할 수 있는 곳에서는
                      # 이 설정 없이 실행하지 마세요.
                      - name: GATEWAY_TENANTS
                        valueFrom:
                            secretKeyRef:
                                name: gateway-tenants
                                key: GATEWAY_TENANTS
                                optional: true
                  startupProbe:
                      httpGet:
                          path: /health
                          port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 30
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 8080
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 8080
                      initialDelaySeconds: 5
                      periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
    name: gateway
    namespace: claude-agent
spec:
    type: ClusterIP
    selector:
        app: gateway
    ports:
        - port: 8080
          targetPort: 8080
