# =============================================================================
# Egress Proxy — nginx 구성
# =============================================================================
#
# 필요한 이유:
#     Agent pod는 임의의 코드를 실행할 수 있습니다(coding agent의 핵심 역할).
#     Network 제어가 없으면 침해되거나 잘못 동작하는 agent가 internet의
#     어느 host에도 접근하여 data를 유출하거나 내부 service를 공격하거나
#     외부 API를 남용할 수 있습니다.
#
#     이 proxy는 Kubernetes NetworkPolicy와 함께 agent pod가
#     api.anthropic.com에만 접근하게 보장합니다:
#
#         1. K8s NetworkPolicy는 이 proxy(및 DNS)를 제외한 agent pod의
#               모든 egress를 차단합니다.
#         2. 이 proxy는 api.anthropic.com으로만 요청을 전달합니다.
#
#     함께 agent network 접근에 대한 엄격한 allowlist를 구성합니다.
#
# 여기서 TLS가 작동하는 방식:
#     Proxy는 self-signed certificate(generate-certs.sh가 생성)로 TLS를
#     종료합니다. Agent pod는 proxy certificate에 서명한 CA certificate를
#     가리키는 NODE_EXTRA_CA_CERTS 환경 변수를 통해
#     이 certificate를 신뢰합니다. 그런 다음 proxy는 실제 upstream인
#     api.anthropic.com으로 자체 TLS connection을 만듭니다.
#
#     Traffic 흐름:
#         Agent pod --[self-signed certificate의 TLS]--> egress-proxy --[TLS]--> api.anthropic.com
#
# 더 많은 ENDPOINT로 확장하기:
#     이 demo는 ANTHROPIC_BASE_URL로 Claude API만 proxy합니다. 전체
#     telemetry 및 error reporting(statsig.anthropic.com, sentry.io, claude.ai)에는
#     대신 HTTPS_PROXY를 사용할 것입니다. 참고:
#   https://code.claude.com/docs/en/corporate-proxy
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;

    # Anthropic API upstream. Hostname은 시작 시 cluster의 DNS
    # (/etc/resolv.conf가 가리키는 대상)로 한 번 해석됩니다. 외부 resolver가
    # 없으므로 이 격리 구성 요소는 cluster 외부에 의존하거나
    # metadata를 유출하지 않습니다. Tradeoff: 장기 실행 proxy pod 아래에서
    # API IP가 바뀌면 다시 해석하도록 egress-proxy deployment를
    # 재시작하세요.
    upstream anthropic_api {
        server api.anthropic.com:443;
        keepalive 32;
    }

    # HTTPS server - Agent의 TLS 종료, Anthropic API로 proxy
    server {
        listen 443 ssl;
        server_name egress-proxy;

        # 자체 self-signed certificate(demo CA가 서명)
        ssl_certificate /etc/nginx/certs/proxy.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 모든 요청을 Anthropic API로 proxy
        location / {
            proxy_pass https://anthropic_api;
            proxy_ssl_server_name on;
            proxy_ssl_name api.anthropic.com;

            # System CA bundle로 upstream certificate를 검증합니다.
            # 이것이 없으면 api.anthropic.com으로 응답한 어떤 대상도
            # (예: DNS 조작) 조용히 수락될 것입니다.
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            # Cloudflare에 올바른 Host header 설정
            proxy_set_header Host api.anthropic.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 긴 API 호출을 위한 timeout
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Streaming 응답용
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # HTTP health check
    server {
        listen 80;

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location / {
            return 403 'Use HTTPS';
        }
    }
}
